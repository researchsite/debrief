name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run
        env:
          BRIGHTDATA_MOCK: "true"
          OPENAI_API_KEY: "sk-test-mock"
          FALKORDB_HOST: "localhost"
          FALKORDB_PORT: "6379"
          FALKORDB_GRAPH: "debrief_test"
